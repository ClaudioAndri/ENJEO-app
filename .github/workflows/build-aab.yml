name: Build AAB production ENJEO (Google Play)

# Lancement manuel uniquement : onglet Actions > ce workflow > Run workflow.
on:
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets de signature
        env:
          KS: ${{ secrets.ENJEO_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ENJEO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Secrets manquants : ENJEO_KEYSTORE_BASE64 et ENJEO_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Dernière version stable de Flutter : Google Play exige de cibler Android 16 (API 36).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - name: Générer les fichiers Android
        run: |
          flutter create --project-name enjeo --org com.enjeo --platforms=android .
          rm -f test/widget_test.dart

      - name: Configurer Android (identifiant, Android 6 minimum, cible API 36)
        run: |
          sed -i 's/android:label="[^"]*"/android:label="ENJEO"/' android/app/src/main/AndroidManifest.xml
          sed -i -E 's/(applicationId[ =]+)"[^"]*"/\1"com.enjeo.app"/' android/app/build.gradle*
          sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle*
          sed -i -E 's/targetSdk(Version)?[ =]+flutter\.targetSdkVersion/targetSdk = 36/' android/app/build.gradle*
          sed -i -E 's/compileSdk(Version)?[ =]+flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle*
          grep -n "applicationId\|minSdk\|targetSdk\|compileSdk" android/app/build.gradle* || true

      - name: Dépendances
        run: flutter pub get

      - name: Tests des règles du jeu
        run: flutter test

      # Le numéro de build augmente à chaque lancement : Google Play l'exige à chaque envoi.
      - name: Construire l'AAB
        run: flutter build appbundle --release --build-name=0.1.0 --build-number=${{ github.run_number }}

      - name: Signer l'AAB avec la clé d'envoi
        env:
          KS: ${{ secrets.ENJEO_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ENJEO_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=build/app/outputs/bundle/release/app-release.aab
          zip -q -d "$AAB" 'META-INF/*' || true
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$PW" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" upload
          jarsigner -verify "$AAB"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Publier l'AAB
        uses: actions/upload-artifact@v4
        with:
          name: enjeo-aab-play-store
          path: build/app/outputs/bundle/release/app-release.aab
