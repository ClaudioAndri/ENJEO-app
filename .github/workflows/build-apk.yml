name: Build APK de test ENJEO

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Générer les fichiers Android
        run: |
          flutter create --project-name enjeo --org com.enjeo --platforms=android .
          rm -f test/widget_test.dart

      - name: Android 6 minimum et nom de l'application
        run: |
          sed -i -E 's/minSdk(Version)?[ =]+flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle*
          sed -i 's/android:label="[^"]*"/android:label="ENJEO"/' android/app/src/main/AndroidManifest.xml
          sed -i -E 's/(applicationId[ =]+)"[^"]*"/\1"com.enjeo.app"/' android/app/build.gradle*
          grep -n "minSdk\|applicationId" android/app/build.gradle* || true

      - name: Dépendances
        run: flutter pub get

      - name: Tests des règles du jeu
        run: flutter test

      - name: Construire l'APK
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: enjeo-apk-test
          path: build/app/outputs/flutter-apk/app-release.apk

  # Captures d'écran réelles de l'application. Ce job est indépendant : s'il
  # échoue, il n'empêche jamais l'APK d'être construit.
  screenshots:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Générer les captures
        run: flutter test screenshots/capture_test.dart --update-goldens

      - name: Publier les captures
        uses: actions/upload-artifact@v4
        with:
          name: enjeo-captures-ecran
          path: screenshots/out/*.png
